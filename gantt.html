<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Gantt · Despacho de Campo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/coords.js"></script>
<script src="assets/js/theme.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="assets/js/logo.js"></script>
<script src="assets/js/reciboUss.js"></script>
<style>
:root{--bg:#0a0a0f;--card:#15151f;--card2:#1a1a24;--s1:rgba(255,255,255,.06);--s2:rgba(255,255,255,.12);
  --tx:#f5f3ea;--dm:#a8a596;--df:#6b6857;--gold:#f5c542;--gold2:#e0a818;--amber:#ffb020;--cream:#fff8e6;
  --gn:#3ddc97;--bl:#4d9fff;--cy:#36d6e7;--pu:#b48cff;--re:#ff5d6c;
  --FD:'Sora','Segoe UI',sans-serif;--FB:'Inter','Segoe UI',sans-serif;--LBL:200px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--FB);background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
.page{padding:16px 18px 40px;max-width:1600px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 18px;margin-bottom:14px;
  border-radius:14px;background:linear-gradient(120deg,rgba(245,197,66,.12),rgba(224,168,24,.04));
  border:1px solid rgba(245,197,66,.18);box-shadow:0 20px 50px -22px rgba(0,0,0,.85)}
h1{font-family:var(--FD);font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
h1 i{color:var(--gold)}
.tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.btn{cursor:pointer;border:1px solid rgba(245,197,66,.4);color:#1a1405;font-family:var(--FB);font-size:13px;font-weight:700;
  padding:8px 14px;border-radius:10px;display:inline-flex;align-items:center;gap:7px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));transition:.2s;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--tx);border-color:var(--s2)}
.btn.ghost:hover{background:rgba(245,197,66,.12)}
.btn.sm{padding:6px 10px;font-size:12px}
.dnav{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:1px solid var(--s1);border-radius:10px;padding:5px 8px}
.dnav b{font-family:var(--FD);font-size:13px;min-width:150px;text-align:center}
.dnav i{cursor:pointer;color:var(--dm);padding:5px 8px;border-radius:7px}
.dnav i:hover{background:rgba(245,197,66,.14);color:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dm);margin:0 3px 12px}
.legend span i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* Layout com barra lateral direita */
.layout{display:flex;gap:14px;align-items:flex-start}
.main{flex:1;min-width:0}
.side{width:300px;flex-shrink:0;background:var(--card);border:1px solid var(--s1);border-radius:14px;padding:12px;
  position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;box-shadow:0 20px 50px -22px rgba(0,0,0,.85)}
.side-h{font-family:var(--FD);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.side-h i{color:var(--gold)} .side-h .cnt{color:var(--df);font-weight:400;font-size:12px}
.filtros{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.filtros input,.filtros select{width:100%;padding:8px 10px;border-radius:9px;background:#0c0c12;border:1px solid var(--s1);color:var(--tx);font-family:var(--FB);font-size:12px;outline:none}
.filtros input:focus,.filtros select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,197,66,.12)}
.filtros select option{background:#15151f}
.sidelist{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.sc{background:var(--card2);border:1px solid var(--s1);border-radius:11px;padding:10px 11px;cursor:grab;transition:.15s}
.sc:hover{border-color:rgba(245,197,66,.4);transform:translateY(-1px)}
.sc:active{cursor:grabbing}
.sc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc-h b{font-family:var(--FD);font-size:13px;color:var(--cream)}
.sc-e{font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-m{font-size:11px;color:var(--dm);margin-top:2px}
.sc-t{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;color:var(--dm);background:rgba(255,255,255,.05);border:1px solid var(--s1);border-radius:20px;padding:2px 8px}
.tag.warn{color:var(--amber);border-color:rgba(255,176,32,.35);background:rgba(255,176,32,.1)}
.badge{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}

/* GANTT */
.crd{background:var(--card);border:1px solid var(--s1);border-radius:14px;box-shadow:0 20px 50px -22px rgba(0,0,0,.85)}
.gwrap{overflow-x:auto;overflow-y:hidden}
.ghead{display:flex;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--s2);background:var(--card2)}
.gcorner{width:var(--LBL);flex-shrink:0;position:sticky;left:0;z-index:4;background:var(--card2);border-right:1px solid var(--s2);
  padding:10px 12px;font-family:var(--FD);font-size:11.5px;color:var(--dm);display:flex;align-items:center;gap:7px}
.hcol{flex-shrink:0;text-align:left;font-size:10.5px;color:var(--df);padding:8px 0 8px 4px;border-left:1px solid rgba(255,255,255,.05)}
.grow{display:flex;border-bottom:1px solid rgba(255,255,255,.05);min-height:48px}
.grow:hover .glabel{background:rgba(245,197,66,.05)}
.glabel{width:var(--LBL);flex-shrink:0;position:sticky;left:0;z-index:2;background:var(--card);border-right:1px solid var(--s2);
  padding:8px 10px;display:flex;align-items:center;gap:8px}
.glabel .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.glabel .tn{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;cursor:pointer}
.glabel .tn:hover{color:var(--gold)}
.glabel .rt{cursor:pointer;color:var(--dm);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12px;border:1px solid var(--s1)}
.glabel .rt:hover{color:var(--gold);border-color:var(--gold)}
.gtrack{position:relative;flex:1;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px);background-size:var(--pxh) 100%;transition:background-color .12s}
.gtrack.dragover{background-color:rgba(245,197,66,.08)}
.shade{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.32);pointer-events:none;z-index:0}
.pastshade{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.30);pointer-events:none;z-index:0}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:#ff5d6c;pointer-events:none;z-index:1;box-shadow:0 0 7px rgba(255,93,108,.7)}
.nowline::before{content:"";position:absolute;top:-2px;left:-4px;width:10px;height:10px;border-radius:50%;background:#ff5d6c}
.blk.lock{cursor:not-allowed;opacity:.9}
.folgabar{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,93,108,.12) 0 9px,rgba(255,93,108,.03) 9px 18px);display:flex;align-items:center;justify-content:center;color:#ff9aa4;font-size:11px;font-weight:800;letter-spacing:2px;pointer-events:none;z-index:0}
.blk{position:absolute;height:30px;border:1px solid;border-radius:7px;padding:0 7px;display:flex;align-items:center;gap:5px;
  font-size:11px;white-space:nowrap;overflow:hidden;cursor:grab;transition:.12s;color:var(--tx)}
.blk:hover{filter:brightness(1.25);z-index:2}
.blk:active{cursor:grabbing}
.blk.sel{outline:2px solid var(--gold);outline-offset:1px;z-index:3}
.blk b{font-family:var(--FD);font-weight:700}
.emptyrow{color:var(--df);font-size:11.5px;padding:14px;text-align:center}

/* Bottom: mapa + detalhe */
.bottom{display:grid;grid-template-columns:1fr 320px;gap:14px;margin-top:14px}
#map{height:440px;border-radius:13px;overflow:hidden;border:1px solid var(--s1)}
.detail{background:var(--card);border:1px solid var(--s1);border-radius:13px;padding:16px}
.detail h3{font-family:var(--FD);font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.detail h3 i{color:var(--gold)}
.dl{font-size:12.5px;color:var(--dm);line-height:1.85}
.dl b{color:var(--tx)}
.rotainfo{margin-top:12px;font-size:12px;color:var(--gold);background:rgba(245,197,66,.08);border-left:2px solid var(--gold);padding:8px 11px;border-radius:0 8px 8px 0;min-height:18px}
.rotapanel{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.rp-h{font-size:11px;color:var(--dm);margin-bottom:2px}
.rp-i{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--s1);border-radius:9px;padding:7px 9px;font-size:12px;cursor:grab}
.rp-i:hover{border-color:rgba(245,197,66,.4)}
.rp-i:active{cursor:grabbing}
.rp-i b{font-family:var(--FD)}
.rp-i .rp-n{width:20px;height:20px;border-radius:50%;background:rgba(245,197,66,.15);color:var(--gold);display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.rp-i i{margin-left:auto;color:var(--df)}
.leaflet-popup-content-wrapper{background:var(--card);color:var(--tx);border-radius:10px;border:1px solid var(--s2)}
.leaflet-popup-tip{background:var(--card)}
.leaflet-popup-content-wrapper a.leaflet-popup-close-button{color:var(--dm)}
.mp b{font-family:var(--FD);color:var(--gold)}

/* modal agendar */
.ov{position:fixed;inset:0;z-index:2000;background:rgba(4,4,8,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px}
.ov.on{display:flex}
.modal{width:100%;max-width:420px;background:var(--card);border:1px solid var(--s2);border-radius:16px;padding:20px}
.modal h3{font-family:var(--FD);font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.modal h3 i{color:var(--gold)}
.modal label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--df);margin:12px 0 5px}
.modal input{width:100%;padding:10px;border-radius:10px;background:#0c0c12;border:1px solid var(--s1);color:var(--tx);font-family:var(--FB);font-size:13px;outline:none}
.modal .row{display:flex;gap:10px;margin-top:18px}
.modal .row .btn{flex:1;justify-content:center}
#agMsg{font-size:12px;margin-top:8px;min-height:15px}
#agMsg.bad{color:var(--re)}
@media(max-width:900px){.layout{flex-direction:column}.side{width:100%;position:static;max-height:none}.bottom{grid-template-columns:1fr}#map{height:340px}}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1><i class="fa-solid fa-bars-staggered"></i> Despacho de Campo — Gantt</h1>
    <div class="tools">
      <div class="dnav">
        <i class="fa-solid fa-chevron-left" onclick="mudarDia(-1)"></i>
        <b id="lblDia">—</b>
        <i class="fa-solid fa-chevron-right" onclick="mudarDia(1)"></i>
      </div>
      <input type="date" id="inpDia" onchange="irData()" style="padding:7px 9px;border-radius:9px;background:#0c0c12;border:1px solid var(--s1);color:var(--tx);font-family:var(--FB);font-size:12.5px">
      <button class="btn ghost sm" onclick="hoje()"><i class="fa-solid fa-calendar-day"></i> Hoje</button>
      <button class="btn ghost sm" onclick="carregar()"><i class="fa-solid fa-rotate"></i> Atualizar</button>
    </div>
  </header>

  <div class="legend">
    <span><i style="background:#ffb020"></i>Agendado / pendente</span>
    <span><i style="background:#36d6e7"></i>Deslocamento</span>
    <span><i style="background:#b48cff"></i>Execução</span>
    <span><i style="background:#3ddc97"></i>Encerrado</span>
    <span style="color:var(--df)">· Arraste um chamado da direita para a linha do técnico · <i class="fa-solid fa-route"></i> gera a rota do dia</span>
  </div>

  <div class="layout">
    <div class="main">
      <div class="crd">
        <div class="gwrap" id="gwrap">
          <div class="ghead" id="ghead"></div>
          <div id="grows"></div>
        </div>
      </div>
      <div class="bottom">
        <div id="map"></div>
        <div class="detail">
          <h3><i class="fa-solid fa-circle-info"></i> Atividade</h3>
          <div class="dl" id="detalhe">Selecione uma atividade no Gantt, no mapa ou na barra lateral.</div>
          <div class="rotainfo" id="rotaInfo"></div>
          <div class="rotapanel" id="rotaPanel"></div>
        </div>
      </div>
    </div>

    <aside class="side">
      <div class="side-h"><i class="fa-solid fa-inbox"></i> Chamados abertos <span class="cnt" id="sideCnt"></span></div>
      <div class="filtros">
        <input id="fNum" placeholder="🔍 Nº do chamado..." oninput="renderSide()">
        <select id="fMun" onchange="renderSide()"></select>
        <select id="fDep" onchange="renderSide()"></select>
        <select id="fSt" onchange="renderSide()"></select>
        <input type="date" id="fData" title="Data de abertura" onchange="renderSide()">
        <button class="btn ghost sm" onclick="limparFiltros()" style="justify-content:center"><i class="fa-solid fa-eraser"></i> Limpar filtros</button>
      </div>
      <div class="sidelist" id="sidelist"></div>
    </aside>
  </div>
</div>

<!-- Modal agendar -->
<div class="ov" id="ovAg">
  <div class="modal">
    <h3><i class="fa-regular fa-calendar-check"></i> Agendar atividade <span id="agNum" style="color:var(--gold)"></span></h3>
    <label>Data</label>
    <input type="date" id="agData">
    <label>Hora de início</label>
    <input type="time" id="agHora" value="09:00">
    <label>Duração (minutos)</label>
    <input type="number" id="agDur" min="15" step="15" value="60">
    <div class="row">
      <button class="btn ghost" onclick="fecharAg()">Cancelar</button>
      <button class="btn" id="btnAg" onclick="confirmarAg()"><i class="fa-solid fa-check"></i> Agendar</button>
    </div>
    <div id="agMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script src="assets/js/nav.js"></script>
<script>
var H0=6,H1=20,PXH=64;
var DIA=isoHoje(),TECNICOS=[],CHAMADOS=[],EXCECOES=[];
var MAP=null,ML=null,ROTA=null,MK={},SEL=null,agId=null;
var ROTA_TEC=null,ROTA_STOPS=[],rpFrom=null;

function nm(s){return(s||"").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();}
function cap(s){return(s||"").toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase();});}
function esc(s){return(s||"").toString().replace(/"/g,"&quot;");}
function isoHoje(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function estado(st){var n=nm(st);if(/encerrad|finaliz|conclu|resolvid/.test(n))return"encerrado";if(/execu/.test(n))return"execucao";if(/desloca/.test(n))return"deslocamento";return"pendente";}
function corEstado(e){return e==="encerrado"?"#3ddc97":e==="execucao"?"#b48cff":e==="deslocamento"?"#36d6e7":"#ffb020";}
function coordDe(mun){return (window.COORDS_PI&&window.COORDS_PI[nm(mun)])||null;}
function diaLocalDe(iso){if(!iso)return null;var d=new Date(iso);if(isNaN(d))return null;return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function minInicio(iso){var d=new Date(iso);return (d.getHours()-H0)*60+d.getMinutes();}
function fmtHora(iso){var d=new Date(iso);return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
function shortDep(d){var m=(d||"").match(/^\D*(\d+)/);return m?("Item "+m[1]):((d||"").length>18?d.slice(0,18)+"…":d);}
function hm(t){var p=(t||"08:00").toString().split(":");return (parseInt(p[0],10)-H0)*60+(parseInt(p[1],10)||0);}
function dispDoDia(tec){
  var wd=new Date(DIA+"T12:00:00").getDay();
  var ex=EXCECOES.find(function(e){return e.tecnico_id===tec.id && e.data===DIA;});
  if(ex){if(ex.tipo==="folga")return{folga:true};return{folga:false,ini:hm(ex.hora_inicio||tec.hora_inicio||"08:00"),fim:hm(ex.hora_fim||tec.hora_fim||"18:00")};}
  if((tec.dias_semana||[1,2,3,4,5]).indexOf(wd)>=0)return{folga:false,ini:hm(tec.hora_inicio||"08:00"),fim:hm(tec.hora_fim||"18:00")};
  return{folga:true};
}

function mudarDia(n){var d=new Date(DIA+"T12:00:00");d.setDate(d.getDate()+n);DIA=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);render();}
function irData(){var v=document.getElementById("inpDia").value;if(v){DIA=v;render();}}
function hoje(){DIA=isoHoje();render();}

function carregar(){
  Promise.all([fetchTecnicos(),fetchChamadosTodos(),fetchExcecoesTodas()]).then(function(r){
    TECNICOS=(r[0]||[]).filter(function(t){return t.ativo!==false;});
    CHAMADOS=r[1]||[];
    EXCECOES=r[2]||[];
    render();
  }).catch(function(e){document.getElementById("grows").innerHTML='<div class="emptyrow">Erro ao carregar: '+(e.message||e)+'</div>';});
}

function render(){
  var dd=new Date(DIA+"T12:00:00");
  document.getElementById("lblDia").textContent=dd.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"});
  document.getElementById("inpDia").value=DIA;
  document.documentElement.style.setProperty("--pxh",PXH+"px");

  var head='<div class="gcorner"><i class="fa-solid fa-user-gear"></i> Técnico</div>';
  for(var h=H0;h<H1;h++)head+='<div class="hcol" style="width:'+PXH+'px">'+h+":00</div>";
  document.getElementById("ghead").innerHTML=head;

  var totalW=(H1-H0)*PXH,rows="";
  TECNICOS.forEach(function(t){
    var acts=CHAMADOS.filter(function(c){return c.tecnico===t.nome && diaLocalDe(c.agendado_em)===DIA;});
    acts.sort(function(a,b){return new Date(a.agendado_em)-new Date(b.agendado_em);});
    var lanes=[];
    acts.forEach(function(c){var s=minInicio(c.agendado_em),e=s+(c.duracao_min||60);var l=-1;for(var i=0;i<lanes.length;i++){if(lanes[i]<=s){l=i;break;}}if(l<0){l=lanes.length;lanes.push(e);}else lanes[l]=e;c._lane=l;});
    var nl=Math.max(1,lanes.length),rowH=nl*34+8;
    var blocks=acts.map(function(c){
      var s=minInicio(c.agendado_em);var left=Math.max(0,s/60*PXH);var w=Math.max(36,(c.duracao_min||60)/60*PXH);
      var col=corEstado(estado(c.status));
      var titulo="#"+c.num_chamado+" · "+fmtHora(c.agendado_em)+" · "+(c.tipo_atendimento||"")+" · "+cap(c.municipio||"");
      var trav=noPassado(c);
      return '<div class="blk'+(SEL===c.id?' sel':'')+(trav?' lock':'')+'" data-id="'+c.id+'" draggable="'+(trav?'false':'true')+'" ondragstart="arrastar(event,'+c.id+')" style="left:'+left+'px;width:'+w+'px;top:'+(c._lane*34+5)+'px;background:'+col+'26;border-color:'+col+'" onclick="selecionar('+c.id+')" title="'+esc(titulo)+'"><b>#'+c.num_chamado+'</b> '+esc((c.tipo_atendimento||"").substring(0,20))+(trav?' <i class="fa-solid fa-lock" style="margin-left:auto;font-size:9px;opacity:.75"></i>':'')+'</div>';
    }).join("");
    var disp=dispDoDia(t),overlay="",totMin=(H1-H0)*60;
    if(disp.folga)overlay='<div class="folgabar">FOLGA</div>';
    else{var iniM=Math.max(0,Math.min(totMin,disp.ini)),fimM=Math.max(0,Math.min(totMin,disp.fim));
      if(iniM>0)overlay+='<div class="shade" style="left:0;width:'+(iniM/60*PXH)+'px"></div>';
      if(fimM<totMin)overlay+='<div class="shade" style="left:'+(fimM/60*PXH)+'px;width:'+((totMin-fimM)/60*PXH)+'px"></div>';}
    if(ehHoje()){var nowM=Math.max(0,Math.min(totMin,(new Date().getHours()-H0)*60+new Date().getMinutes())),nx=nowM/60*PXH;
      overlay+='<div class="pastshade" style="width:'+nx+'px"></div><div class="nowline" style="left:'+nx+'px"></div>';}
    var nomeJs=(t.nome||"").replace(/'/g,"\\'");
    rows+='<div class="grow" style="height:'+rowH+'px">'+
      '<div class="glabel"><span class="dot" style="background:'+(t.cor||"#4d9fff")+'"></span>'+
        '<span class="tn" title="'+esc(t.nome)+'" onclick="infoTecnico(\''+nomeJs+'\')">'+(t.nome||"—")+'</span>'+
        '<span class="rt" title="Gerar rota do dia" onclick="rota(\''+nomeJs+'\')"><i class="fa-solid fa-route"></i></span></div>'+
      '<div class="gtrack" style="height:'+rowH+'px;width:'+totalW+'px" ondragover="permitir(event)" ondragenter="this.classList.add(\'dragover\')" ondragleave="this.classList.remove(\'dragover\')" ondrop="soltar(event,\''+nomeJs+'\')">'+overlay+blocks+'</div></div>';
  });
  if(!TECNICOS.length)rows='<div class="emptyrow">Nenhum técnico ativo. Cadastre em Configurações → Técnicos.</div>';
  document.getElementById("grows").innerHTML=rows;

  renderSide();
  renderMapa();
}

/* ===== BARRA LATERAL (chamados abertos + filtros + arrastar) ===== */
function distinct(arr,key){var s=new Set();arr.forEach(function(c){var v=(c[key]||"").toString().trim();if(v&&v!=="-")s.add(v);});return Array.from(s).sort(function(a,b){return a.localeCompare(b,"pt-BR");});}
function fillSel(id,lbl,vals){var el=document.getElementById(id);var cur=el.value;el.innerHTML='<option value="">'+lbl+'</option>'+vals.map(function(v){return'<option value="'+esc(v)+'"'+(v===cur?" selected":"")+'>'+v+'</option>';}).join("");}
function renderSide(){
  var abertos=CHAMADOS.filter(function(c){return estado(c.status)!=="encerrado";});
  fillSel("fMun","Todos os municípios",distinct(abertos,"municipio"));
  fillSel("fDep","Todos os departamentos",distinct(abertos,"departamento"));
  fillSel("fSt","Todos os status",distinct(abertos,"status"));
  var fn=(document.getElementById("fNum").value||"").toLowerCase().trim();
  var fm=document.getElementById("fMun").value,fd=document.getElementById("fDep").value,fs=document.getElementById("fSt").value,fdt=document.getElementById("fData").value;
  var list=abertos.filter(function(c){
    if(fn && String(c.num_chamado||"").toLowerCase().indexOf(fn)<0)return false;
    if(fm && (c.municipio||"")!==fm)return false;
    if(fd && (c.departamento||"")!==fd)return false;
    if(fs && (c.status||"")!==fs)return false;
    if(fdt && String(c.data_abertura||"").slice(0,10)!==fdt)return false;
    return true;
  });
  document.getElementById("sideCnt").textContent="("+list.length+")";
  var box=document.getElementById("sidelist");
  if(!list.length){box.innerHTML='<div class="emptyrow">Nenhum chamado com esses filtros.</div>';return;}
  box.innerHTML=list.map(function(c){
    var e=estado(c.status),col=corEstado(e);
    var ag=c.agendado_em?'<span class="tag"><i class="fa-regular fa-clock"></i> '+diaLocalDe(c.agendado_em).split("-").reverse().join("/")+' '+fmtHora(c.agendado_em)+'</span>':'';
    var tec=c.tecnico?'<span class="tag"><i class="fa-solid fa-user"></i> '+esc(c.tecnico)+'</span>':'<span class="tag warn">sem técnico</span>';
    return '<div class="sc" draggable="true" ondragstart="arrastar(event,'+c.id+')" onclick="selecionar('+c.id+')">'+
      '<div class="sc-h"><b>#'+(c.num_chamado||"s/nº")+'</b><span class="badge" style="background:'+col+'22;color:'+col+'">'+esc(c.status||"—")+'</span></div>'+
      '<div class="sc-e">'+esc(c.escola||c.municipio||"—")+'</div>'+
      '<div class="sc-m">'+cap(c.municipio||"—")+(c.departamento?' · '+shortDep(c.departamento):'')+(c.prioridade?' · '+c.prioridade:'')+'</div>'+
      '<div class="sc-t">'+tec+' '+ag+'</div></div>';
  }).join("");
}
function limparFiltros(){["fNum","fMun","fDep","fSt","fData"].forEach(function(id){document.getElementById(id).value="";});renderSide();}

/* ===== ARRASTAR-SOLTAR ===== */
function arrastar(e,id){e.dataTransfer.setData("text/plain",String(id));e.dataTransfer.effectAllowed="move";}
function permitir(e){e.preventDefault();e.dataTransfer.dropEffect="move";}
function ehHoje(){return DIA===isoHoje();}
function noPassado(c){return ehHoje() && c && c.agendado_em && (new Date(c.agendado_em) < new Date());}
function temHabilidade(tec,c){
  var habs=(tec&&tec.habilidades)||[];
  var reqH=((c&&c.habilidade)||"").trim();
  if(reqH){return !habs.length || habs.some(function(h){return nm(h)===nm(reqH);});}
  // fallback heurístico pelo tipo/departamento quando o chamado não tem habilidade definida
  if(!habs.length)return true;
  var tipo=nm(c&&c.tipo_atendimento||""),dep=nm(c&&c.departamento||"");
  if(!tipo&&!dep)return true;
  return habs.some(function(h){var hn=nm(h);if(!hn)return false;if(tipo&&(tipo.indexOf(hn)>=0||hn.indexOf(tipo)>=0))return true;if(dep&&dep.indexOf(hn)>=0)return true;return false;});
}
function temRota(tec,c){var rots=(tec&&tec.rotas)||[];var reqR=((c&&c.rota)||"").trim();if(!reqR||!rots.length)return true;return rots.some(function(r){return nm(r)===nm(reqR);});}
function soltar(e,nome){
  e.preventDefault();e.currentTarget.classList.remove("dragover");
  var id=parseInt(e.dataTransfer.getData("text/plain"),10);if(!id)return;
  var c=CHAMADOS.find(function(x){return x.id===id;});
  var tec=TECNICOS.find(function(t){return t.nome===nome;});
  // trava: não move atividade que já está no passado
  if(noPassado(c)){alert("Esta atividade já passou na linha do tempo e está travada.");return;}
  // bloqueio: técnico de folga neste dia
  if(tec && dispDoDia(tec).folga){alert('O técnico "'+nome+'" está de FOLGA neste dia. Não é possível atribuir atividades.');return;}
  var rect=e.currentTarget.getBoundingClientRect();
  var x=e.clientX-rect.left;
  var mins=Math.max(0,Math.round((x/PXH*60)/15)*15);
  var h=H0+Math.floor(mins/60),m=mins%60;if(h>=H1){h=H1-1;m=45;}
  var hora=("0"+h).slice(-2)+":"+("0"+m).slice(-2);
  var iso=new Date(DIA+"T"+hora+":00").toISOString();
  // bloqueio: não agendar no passado (linha do tempo já passou)
  if(ehHoje() && new Date(iso) < new Date()){alert("Não é possível agendar antes do horário atual (a linha do tempo já passou desse ponto).");return;}
  // aviso (soft): habilidade/rota incompatível
  if(tec && c){
    var faltas=[];
    if(!temHabilidade(tec,c))faltas.push('habilidade "'+(c.habilidade||c.tipo_atendimento||"—")+'"');
    if(!temRota(tec,c))faltas.push('rota "'+(c.rota||"—")+'"');
    if(faltas.length && !confirm('O técnico "'+nome+'" não atende: '+faltas.join(" e ")+'.\nAtribuir mesmo assim?'))return;
  }
  var dur=(c&&c.duracao_min)||60;
  atribuirAgendar(id,nome,iso,dur).then(function(rec){
    var i=CHAMADOS.findIndex(function(x){return x.id===id;});if(i>=0)CHAMADOS[i]=rec;
    // notifica o técnico (não bloqueia em caso de erro)
    criarNotificacao({tecnico_nome:nome,chamado_id:id,num_chamado:rec.num_chamado,
      mensagem:"Novo chamado #"+rec.num_chamado+" — "+diaLocalDe(iso).split("-").reverse().join("/")+" "+hora+" · "+cap(rec.municipio||"")}).catch(function(){});
    SEL=id;render();atualizarDetalhe(id);
  }).catch(function(err){alert("Erro ao agendar: "+(err.message||err));});
}

/* ===== MAPA ===== */
function initMapa(){
  if(MAP||typeof L==="undefined")return;
  MAP=L.map("map",{zoomControl:true,attributionControl:false,minZoom:5}).setView([-7.2,-42.8],6.4);
  var bases={
    "Detalhado":L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd"}),
    "Escuro":L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd"}),
    "Ruas":L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}),
    "Satélite":L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19})
  };
  bases["Detalhado"].addTo(MAP);
  L.control.layers(bases,null,{position:"topright"}).addTo(MAP);
}
function renderMapa(){
  initMapa();if(!MAP)return;
  if(ML)ML.remove();ML=L.layerGroup().addTo(MAP);MK={};
  var doDia=CHAMADOS.filter(function(c){return diaLocalDe(c.agendado_em)===DIA;});
  var bounds=[];
  doDia.forEach(function(c){
    var co=coordDe(c.municipio);if(!co)return;
    var col=corEstado(estado(c.status));
    var mk=L.circleMarker(co,{radius:8,color:col,weight:2,fillColor:col,fillOpacity:.5});
    mk.bindPopup('<div class="mp"><b>#'+c.num_chamado+'</b> · '+fmtHora(c.agendado_em)+'<br>'+cap(c.municipio||"")+'<br>'+(c.tecnico||"")+'<br>'+(c.status||"")+'</div>');
    mk.on("click",function(){selecionar(c.id,true);});
    ML.addLayer(mk);MK[c.id]=mk;bounds.push(co);
  });
  if(bounds.length){setTimeout(function(){MAP.invalidateSize();try{MAP.fitBounds(bounds,{maxZoom:9,padding:[30,30]});}catch(e){}},150);}
}

/* ===== SELEÇÃO / DETALHE ===== */
function selecionar(id,fromMap){
  SEL=id;
  document.querySelectorAll(".blk").forEach(function(b){b.classList.toggle("sel",b.getAttribute("data-id")==String(id));});
  var mk=MK[id];if(mk){MAP.setView(mk.getLatLng(),Math.max(MAP.getZoom(),8),{animate:true});mk.openPopup();}
  atualizarDetalhe(id);
}
function atualizarDetalhe(id){
  var c=CHAMADOS.find(function(x){return x.id===id;});if(!c)return;
  var co=coordDe(c.municipio);
  var abertura=c.data_abertura?String(c.data_abertura).slice(0,10).split("-").reverse().join("/"):"—";
  document.getElementById("detalhe").innerHTML=
    '<b>#'+(c.num_chamado||"s/nº")+'</b> — '+esc(c.escola||"—")+'<br>'+
    'Município: <b>'+cap(c.municipio||"—")+'</b>'+(c.num_inep?' · INEP '+esc(c.num_inep):'')+'<br>'+
    'Departamento: '+esc(c.departamento||"—")+'<br>'+
    'Tipo: '+esc(c.tipo_atendimento||"—")+'<br>'+
    ((c.habilidade||c.rota)?('Habilidade: '+esc(c.habilidade||"—")+' · Rota: '+esc(c.rota||"—")+'<br>'):'')+
    'Status: <b>'+esc(c.status||"—")+'</b>'+(c.prioridade?' · '+esc(c.prioridade):'')+'<br>'+
    ((estado(c.status)==="encerrado"||c.uss_total!=null)?(
      (c.uss_total!=null?('USS total: <b style="color:var(--gold)">'+c.uss_total+'</b>'+(c.uss_detalhe?('<div style="font-size:11px;color:var(--df);margin:2px 0 4px;line-height:1.4">'+esc(c.uss_detalhe)+'</div>'):'')):'')+
      '<div style="display:flex;gap:6px;margin:5px 0 6px"><button class="btn ghost sm" onclick="pdfUss('+c.id+')"><i class="fa-solid fa-file-pdf"></i> PDF do chamado</button><button class="btn ghost sm" onclick="imgUss('+c.id+')"><i class="fa-solid fa-image"></i> Imagem</button></div>'
    ):'')+
    'Técnico: <b>'+esc(c.tecnico||"—")+'</b><br>'+
    'Aberto em: '+abertura+(c.data_prevista?' · previsto: '+esc(c.data_prevista):'')+'<br>'+
    (c.agendado_em?('Agendado: <b>'+fmtHora(c.agendado_em)+'</b> · '+(c.duracao_min||60)+' min<br>'):'Sem horário<br>')+
    (c.encerrado_por?('Encerrado por: <b>'+esc(c.encerrado_por)+'</b><br>'):'')+
    (c.relatorio_tecnico?('<div style="margin-top:6px;padding:8px;background:rgba(255,255,255,.04);border-radius:8px;color:var(--tx)">📝 '+esc(c.relatorio_tecnico)+'</div>'):'')+
    (co?'':'<span style="color:var(--re)">⚠ município sem coordenada no mapa</span><br>')+
    (noPassado(c)
      ? '<div style="margin-top:10px;color:var(--df)"><i class="fa-solid fa-lock"></i> Atividade no passado — travada (não pode reagendar/remover).</div>'
      : '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+
          '<button class="btn ghost sm" onclick="abrirAg('+c.id+')"><i class="fa-regular fa-calendar-check"></i> '+(c.agendado_em?'Reagendar':'Agendar')+'</button>'+
          (c.agendado_em?'<button class="btn ghost sm" onclick="removerHorario('+c.id+')"><i class="fa-solid fa-xmark"></i> Remover horário</button>':'')+
        '</div>');
}
function pdfUss(id){var c=CHAMADOS.find(function(x){return x.id===id;});if(c)reciboUssPDF(c);}
function imgUss(id){var c=CHAMADOS.find(function(x){return x.id===id;});if(c)reciboUssIMG(c);}
function infoTecnico(nome){
  var t=TECNICOS.find(function(x){return x.nome===nome;});if(!t)return;
  var doDia=CHAMADOS.filter(function(c){return c.tecnico===nome && diaLocalDe(c.agendado_em)===DIA;}).length;
  var WD=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  var exp=(t.hora_inicio||"08:00").slice(0,5)+"–"+(t.hora_fim||"18:00").slice(0,5);
  var dias=((t.dias_semana||[]).map(function(d){return WD[d];}).join(", "))||"—";
  var d2=dispDoDia(t);
  document.getElementById("detalhe").innerHTML=
    '<b>'+esc(t.nome)+'</b> <span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:'+(t.cor||"#4d9fff")+';vertical-align:middle"></span>'+(d2.folga?' <span class="badge" style="background:rgba(255,93,108,.16);color:#ff9aa4">FOLGA hoje</span>':'')+'<br>'+
    'E-mail: '+esc(t.email||"—")+'<br>'+
    'Telefone: '+esc(t.telefone||"—")+'<br>'+
    'Base: '+esc(t.base_atendimento||"—")+'<br>'+
    'Expediente: <b>'+exp+'</b> · '+dias+'<br>'+
    'Habilidades: '+((t.habilidades&&t.habilidades.length)?esc(t.habilidades.join(", ")):"—")+'<br>'+
    'Rotas: '+((t.rotas&&t.rotas.length)?esc(t.rotas.join(", ")):"—")+'<br>'+
    'Atividades hoje: <b>'+doDia+'</b><br>'+
    '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><span class="btn ghost sm" onclick="rota(\''+esc(t.nome).replace(/'/g,"\\'")+'\')" style="cursor:pointer"><i class="fa-solid fa-route"></i> Gerar rota</span><a class="btn ghost sm" href="config.html" target="_top"><i class="fa-solid fa-gear"></i> Configurar</a></div>';
}

/* ===== AGENDAR ===== */
function abrirAg(id){agId=id;var c=CHAMADOS.find(function(x){return x.id===id;});
  document.getElementById("agNum").textContent="#"+((c&&c.num_chamado)||"");
  document.getElementById("agData").value=c&&c.agendado_em?diaLocalDe(c.agendado_em):DIA;
  document.getElementById("agHora").value=c&&c.agendado_em?fmtHora(c.agendado_em):"09:00";
  document.getElementById("agDur").value=(c&&c.duracao_min)||60;
  var m=document.getElementById("agMsg");m.className="";m.textContent="";
  document.getElementById("ovAg").classList.add("on");}
function fecharAg(){document.getElementById("ovAg").classList.remove("on");agId=null;}
function confirmarAg(){
  var data=document.getElementById("agData").value,hora=document.getElementById("agHora").value,dur=parseInt(document.getElementById("agDur").value,10)||60;
  var m=document.getElementById("agMsg");m.className="";
  if(!data||!hora){m.className="bad";m.textContent="Informe data e hora.";return;}
  var iso=new Date(data+"T"+hora+":00").toISOString();
  var btn=document.getElementById("btnAg");btn.disabled=true;
  agendarChamado(agId,iso,dur).then(function(rec){
    var i=CHAMADOS.findIndex(function(c){return c.id===agId;});if(i>=0)CHAMADOS[i]=rec;
    btn.disabled=false;fecharAg();DIA=diaLocalDe(iso);render();
  }).catch(function(e){btn.disabled=false;m.className="bad";m.textContent="Erro: "+(e.message||e);});
}
function removerHorario(id){
  if(!confirm("Remover o horário desta atividade?"))return;
  desagendarChamado(id).then(function(rec){var i=CHAMADOS.findIndex(function(c){return c.id===id;});if(i>=0)CHAMADOS[i]=rec;SEL=null;render();document.getElementById("detalhe").innerHTML="Horário removido.";})
    .catch(function(e){alert("Erro: "+(e.message||e));});
}

/* ===== ROTA (OSRM) + reordenação ===== */
function rota(nome){
  ROTA_TEC=nome;
  ROTA_STOPS=CHAMADOS.filter(function(c){return c.tecnico===nome && diaLocalDe(c.agendado_em)===DIA;})
    .sort(function(a,b){return new Date(a.agendado_em)-new Date(b.agendado_em);});
  desenharRotaMapa();
  renderRotaPanel();
}
function desenharRotaMapa(){
  var info=document.getElementById("rotaInfo");
  var pts=[],semCoord=0;
  ROTA_STOPS.forEach(function(c){var co=coordDe(c.municipio);if(co)pts.push(co);else semCoord++;});
  if(pts.length<2){info.textContent="Rota de "+(ROTA_TEC||"")+": precisa de 2+ atividades agendadas com coordenada de município.";if(ROTA){ROTA.remove();ROTA=null;}return;}
  info.textContent="Calculando rota de "+ROTA_TEC+"...";
  var coordStr=pts.map(function(p){return p[1]+","+p[0];}).join(";");
  fetch("https://router.project-osrm.org/route/v1/driving/"+coordStr+"?overview=full&geometries=geojson")
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j.routes||!j.routes.length){info.textContent="Rota não encontrada.";return;}
      var latlngs=j.routes[0].geometry.coordinates.map(function(c){return [c[1],c[0]];});
      if(ROTA)ROTA.remove();
      ROTA=L.polyline(latlngs,{color:"#f5c542",weight:4,opacity:.9}).addTo(MAP);
      try{MAP.fitBounds(ROTA.getBounds().pad(0.2));}catch(e){}
      var km=(j.routes[0].distance/1000).toFixed(1),min=Math.round(j.routes[0].duration/60);
      info.innerHTML="<b>"+esc(ROTA_TEC)+"</b>: "+pts.length+" paradas · "+km+" km · ~"+min+" min"+(semCoord?" · "+semCoord+" sem coord.":"")+" <span style='color:var(--df)'>(OSRM/OSM)</span>";
    })
    .catch(function(e){info.textContent="Erro ao gerar rota: "+e;});
}
function renderRotaPanel(){
  var box=document.getElementById("rotaPanel");if(!box)return;
  if(!ROTA_STOPS||ROTA_STOPS.length<2){box.innerHTML="";return;}
  box.innerHTML='<div class="rp-h">Ordem da rota — arraste para reordenar (reencaixa os horários)</div>'+
    ROTA_STOPS.map(function(c,i){
      return '<div class="rp-i" draggable="true" ondragstart="rpDrag(event,'+i+')" ondragover="event.preventDefault()" ondrop="rpDrop(event,'+i+')">'+
        '<span class="rp-n">'+(i+1)+'</span> <b>#'+c.num_chamado+'</b> '+fmtHora(c.agendado_em)+' · '+cap(c.municipio||"—")+'<i class="fa-solid fa-grip-vertical"></i></div>';
    }).join("");
}
function rpDrag(e,i){rpFrom=i;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain","rp");}
function rpDrop(e,j){e.preventDefault();e.stopPropagation();if(rpFrom==null||rpFrom===j)return;var it=ROTA_STOPS.splice(rpFrom,1)[0];ROTA_STOPS.splice(j,0,it);rpFrom=null;resequenciar();}
function resequenciar(){
  if(!ROTA_STOPS.length)return;
  var cursor=new Date(ROTA_STOPS[0].agendado_em);
  var updates=ROTA_STOPS.map(function(c){
    var iso=cursor.toISOString();c.agendado_em=iso;
    cursor=new Date(cursor.getTime()+((c.duracao_min||60)*60000));
    return agendarChamado(c.id,iso,c.duracao_min||60);
  });
  document.getElementById("rotaInfo").textContent="Reordenando...";
  Promise.all(updates).then(function(recs){
    recs.forEach(function(rec){var k=CHAMADOS.findIndex(function(x){return x.id===rec.id;});if(k>=0)CHAMADOS[k]=rec;});
    render();rota(ROTA_TEC);
  }).catch(function(e){alert("Erro ao reordenar: "+(e.message||e));});
}

/* ===== INIT ===== */
function tickNow(){
  if(!ehHoje())return;
  var totMin=(H1-H0)*60,nx=Math.max(0,Math.min(totMin,(new Date().getHours()-H0)*60+new Date().getMinutes()))/60*PXH;
  document.querySelectorAll(".nowline").forEach(function(el){el.style.left=nx+"px";});
  document.querySelectorAll(".pastshade").forEach(function(el){el.style.width=nx+"px";});
}
window.addEventListener("load",function(){
  requireAuthAdmin().then(function(user){ if(!user)return; carregar(); });
  setInterval(tickNow,60000);
});
</script>
